<script>
  // -----------------------------------------------------------------
  // Supabase Configuration
  // -----------------------------------------------------------------
  const SUPABASE_URL = "https://rtxlxvzoenpykbrdwyfo.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0eGx4dnpvZW5weWticmR3eWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzAxNzAsImV4cCI6MjEwMzIwNjE3MH0.WxNdRg0W78RYQU0_I4p50I6OFvHEUc1gnSihZao4w6s";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Listen live for incoming replies sent from Discord -> Supabase
  supabaseClient
    .channel('aim-chat-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const chatLog = document.getElementById('aim-chat-log');
      const receiveSound = document.getElementById('aim-receive-sound');
      const newMsg = payload.new;

      // Only handle incoming admin (Discord) messages live to avoid duplicates
      if (newMsg.is_admin) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'aim-chat-msg';
        msgDiv.innerHTML = `<span class="sender">${newMsg.sender || 'Charade212'}:</span> ${newMsg.content}`;
        chatLog.appendChild(msgDiv);
        chatLog.scrollTop = chatLog.scrollHeight;

        receiveSound.play().catch(e => console.log("Audio playback blocked:", e));
      }
    })
    .subscribe();

  // -----------------------------------------------------------------
  // Boot Sequence & UI Handlers
  // -----------------------------------------------------------------
  function startBootSequence(username) {
    const startupAudio = document.getElementById('xp-startup');
    const userScreen = document.getElementById('user-screen');
    const bootScreen = document.getElementById('boot-screen');
    const desktop = document.getElementById('desktop');

    userScreen.style.display = 'none';
    bootScreen.style.display = 'flex';

    startupAudio.play().catch(e => console.log("Audio playback blocked:", e));

    setTimeout(() => {
      bootScreen.style.display = 'none';
      desktop.style.display = 'block';
    }, 3000);
  }

  function triggerError() {
    const errorAudio = document.getElementById('xp-error-sound');
    const errorModal = document.getElementById('error-modal');
    errorAudio.play().catch(e => console.log("Audio playback blocked:", e));
    errorModal.style.display = 'block';
  }

  function closeError() {
    document.getElementById('error-modal').style.display = 'none';
  }

  // Fetch past messages cleanly without duplicating
  async function loadHistory() {
    const chatLog = document.getElementById('aim-chat-log');
    
    // Reset window to welcome banner state before appending history
    chatLog.innerHTML = `<div class="aim-chat-msg"><span class="sender">Charade212:</span> Welcome! Drop a message below to send it live to my Discord.</div>`;

    const { data, error } = await supabaseClient
      .from('messages')
      .select('*')
      .limit(50);

    if (error) {
      console.error("Supabase load history error:", error.message);
      return;
    }

    if (data && data.length > 0) {
      data.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'aim-chat-msg';
        if (msg.is_admin) {
          msgDiv.innerHTML = `<span class="sender">${msg.sender || 'Charade212'}:</span> ${msg.content}`;
        } else {
          msgDiv.innerHTML = `<span class="me">${msg.sender || 'Guest'}:</span> ${msg.content}`;
        }
        chatLog.appendChild(msgDiv);
      });
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  }

  function openAIM() {
    document.getElementById('aim-modal').style.display = 'block';
    loadHistory();
  }

  function closeAIM() {
    document.getElementById('aim-modal').style.display = 'none';
  }

  // -----------------------------------------------------------------
  // AIM Message Sender (Inserts into Supabase)
  // -----------------------------------------------------------------
  async function sendAIMMessage() {
    const input = document.getElementById('aim-msg-input');
    const chatLog = document.getElementById('aim-chat-log');
    const sendSound = document.getElementById('aim-send-sound');
    const text = input.value.trim();

    if (!text) return;

    // Play send sound immediately
    sendSound.play().catch(e => console.log("Audio playback blocked:", e));

    // Render directly in UI immediately
    const msgDiv = document.createElement('div');
    msgDiv.className = 'aim-chat-msg';
    msgDiv.innerHTML = `<span class="me">Guest:</span> ${text}`;
    chatLog.appendChild(msgDiv);
    chatLog.scrollTop = chatLog.scrollHeight;

    input.value = '';

    // Insert to Supabase table
    const { error } = await supabaseClient
      .from('messages')
      .insert([{ sender: 'Guest', content: text, is_admin: false }]);

    if (error) {
      console.error("Failed to send message to Supabase:", error.message);
    }
  }

  // Keypress listener: Enter sends message, Shift+Enter creates line break
  document.addEventListener("DOMContentLoaded", () => {
    const inputArea = document.getElementById('aim-msg-input');
    if (inputArea) {
      inputArea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendAIMMessage();
        }
      });
    }
  });

  // -----------------------------------------------------------------
  // Drag Functionality (Mouse & Touch)
  // -----------------------------------------------------------------
  const aimModal = document.getElementById("aim-modal");
  const aimHeader = document.getElementById("aim-drag-handle");

  let isDragging = false, offsetX = 0, offsetY = 0;

  function handleStart(e) {
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    aimModal.style.transform = 'none';
    offsetX = clientX - aimModal.offsetLeft;
    offsetY = clientY - aimModal.offsetTop;
  }

  function handleMove(e) {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    aimModal.style.left = `${clientX - offsetX}px`;
    aimModal.style.top = `${clientY - offsetY}px`;
  }

  function handleEnd() {
    isDragging = false;
  }

  aimHeader.addEventListener("mousedown", handleStart);
  document.addEventListener("mousemove", handleMove);
  document.addEventListener("mouseup", handleEnd);

  aimHeader.addEventListener("touchstart", handleStart, { passive: true });
  document.addEventListener("touchmove", handleMove, { passive: true });
  document.addEventListener("touchend", handleEnd);
</script>
