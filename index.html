<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charade XP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: "Tahoma", sans-serif; overflow: hidden; }

    /* Phase 1: White Landing Page */
    #landing-screen {
      position: absolute;
      width: 100%; height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #duck-btn {
      background: none; border: none; cursor: pointer; transition: transform 0.1s;
    }
    #duck-btn:hover { transform: scale(1.05); }

    /* Phase 2: Windows XP Boot / Welcome Screen */
    #welcome-screen {
      position: absolute;
      width: 100%; height: 100%;
      background: #000000;
      color: #ffffff;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9;
    }
    .brand-title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-family: "Trebuchet MS", "Tahoma", sans-serif;
    }
    .loading-bar {
      width: 180px; height: 12px; border: 2px solid #5a5a5a; border-radius: 4px; overflow: hidden;
    }
    .loading-block {
      width: 30%; height: 100%; background-color: #2663e0; animation: loading 1.5s infinite linear;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Phase 3: Desktop Environment */
    #desktop {
      position: absolute;
      width: 100%; height: 100%;
      background: url('assets/bliss.jpg') no-repeat center center fixed;
      background-size: cover;
      display: none;
      z-index: 1;
    }
    .icon-grid {
      display: flex; flex-direction: column; gap: 20px; padding: 20px; width: 100px;
    }
    .desktop-icon {
      display: flex; flex-direction: column; align-items: center; text-decoration: none; color: white; text-shadow: 1px 1px 2px #000; font-size: 12px;
    }
    .desktop-icon img { width: 32px; height: 32px; margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- Landing Screen -->
  <div id="landing-screen">
    <button id="duck-btn" onclick="startBootSequence()">
      <img src="images/WindowsDucky.png" alt="Duck Icon" width="128" />
    </button>
  </div>

  <!-- Boot/Welcome Screen -->
  <div id="welcome-screen">
    <div class="brand-title">Charade XP</div>
    <div class="loading-bar">
      <div class="loading-block"></div>
    </div>
  </div>

  <!-- Main Desktop -->
  <div id="desktop">
    <div class="icon-grid">
      <a href="https://charade212.online" class="desktop-icon">
        <img src="assets/folder-icon.png" alt="Folder" />
        <span>Main Site</span>
      </a>
      <a href="#" class="desktop-icon">
        <img src="assets/media-icon.png" alt="Media" />
        <span>Media Player</span>
      </a>
    </div>
  </div>

  <!-- Startup Sound -->
  <audio id="xp-sound" src="assets/xp_startup.mp3" preload="auto"></audio>

  <script>
    function startBootSequence() {
      const audio = document.getElementById('xp-sound');
      const landing = document.getElementById('landing-screen');
      const welcome = document.getElementById('welcome-screen');
      const desktop = document.getElementById('desktop');

      landing.style.display = 'none';
      welcome.style.display = 'flex';

      audio.play().catch(e => console.log("Audio play blocked:", e));

      setTimeout(() => {
        welcome.style.display = 'none';
        desktop.style.display = 'block';
      }, 3000);
    }
  </script>
</body>
</html>
